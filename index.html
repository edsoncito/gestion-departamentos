<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c5b45" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Alquileres" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap"
    />
    <link rel="icon" href="/gestion-departamentos/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/gestion-departamentos/apple-touch-icon.png" />
    <link rel="manifest" href="/gestion-departamentos/manifest.webmanifest" />
    <script>
      try {
        if (localStorage.getItem('rental-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#0e1512'
        }
      } catch (_) {}
    </script>
    <meta
      name="description"
      content="Sistema personal para la gestión de departamentos y pagos de alquiler."
    />
    <title>Gestión de alquileres</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
